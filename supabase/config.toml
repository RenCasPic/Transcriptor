project_id = "transcriptor"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
# Tope global de Storage para desarrollo local. En producción, ajusta el
# equivalente en el Dashboard de Supabase (Storage → Settings). El bucket
# project-sources define su propio límite en la migración 0020.
file_size_limit = "500MiB"
